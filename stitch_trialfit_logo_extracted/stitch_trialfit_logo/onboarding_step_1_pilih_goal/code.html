<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom shadow for selected card based on style guidance */
        .card-shadow {
            box-shadow: 0 2px 8px rgba(11, 27, 59, 0.08);
        }
    </style>

<body class="bg-bg-light min-h-screen flex flex-col font-body text-body antialiased selection:bg-secondary-container selection:text-white">
<!-- Top Bar -->
<header class="flex justify-between items-center px-container-margin-mobile py-4 w-full max-w-md mx-auto z-10 relative shrink-0">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center text-outline-variant rounded-full" disabled="">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<button aria-label="Skip for now" class="font-body text-body text-outline hover:text-on-surface transition-colors">
            Skip for now
        </button>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col px-container-margin-mobile w-full max-w-md mx-auto pb-24">
<!-- Progress Dots -->
<div class="flex justify-center items-center gap-2 mb-8 mt-2">
<div class="w-2.5 h-2.5 rounded-full bg-secondary-container"></div>
<div class="w-2.5 h-2.5 rounded-full border border-border-light bg-surface-container-lowest"></div>
<div class="w-2.5 h-2.5 rounded-full border border-border-light bg-surface-container-lowest"></div>
</div>
<!-- Illustration & Typography -->
<div class="flex flex-col items-center text-center mb-8">
<div class="w-24 h-24 rounded-full bg-surface-container flex items-center justify-center mb-6 text-primary-container">
<span class="material-symbols-outlined icon-fill text-[48px]">fitness_center</span>
</div>
<h1 class="font-h2 text-h2 text-on-background mb-2">What's your goal?</h1>
<p class="font-body text-body text-outline">Pilih tujuan latihan kamu</p>
</div>
<!-- Goal Selection Cards -->
<div class="flex flex-col gap-[16px] flex-grow">
<!-- Card 1: Bulk (Selected State) -->
<label class="group relative flex items-center p-card-padding bg-surface-container-lowest border-2 border-secondary-container rounded-[16px] cursor-pointer card-shadow transition-all">
<input checked="" class="sr-only" name="goal" type="radio" value="bulk"/>
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-primary-container shrink-0 mr-4 group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[24px]">sports_martial_arts</span>
</div>
<div class="flex-grow pr-4">
<h3 class="font-body-bold text-body-bold text-on-background mb-1">Bulk (Massa Otot)</h3>
<p class="font-small text-small text-outline">Membangun massa otot dan kekuatan</p>
</div>
<div class="shrink-0 text-secondary-container">
<span class="material-symbols-outlined icon-fill text-[24px]">radio_button_checked</span>
</div>
</label>
<!-- Card 2: Cut (Unselected State) -->
<label class="group relative flex items-center p-card-padding bg-surface-container-lowest border border-border-light rounded-[16px] cursor-pointer hover:border-outline-variant hover:shadow-sm transition-all">
<input class="sr-only" name="goal" type="radio" value="cut"/>
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center text-outline shrink-0 mr-4 group-hover:text-primary-container group-hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-[24px]">scale</span>
</div>
<div class="flex-grow pr-4">
<h3 class="font-body-bold text-body-bold text-on-background mb-1">Cut (Defisit Kalori)</h3>
<p class="font-small text-small text-outline">Membakar lemak dan membentuk tubuh</p>
</div>
<div class="shrink-0 text-outline-variant group-hover:text-outline transition-colors">
<span class="material-symbols-outlined text-[24px]">radio_button_unchecked</span>
</div>
</label>
<!-- Card 3: Endurance (Unselected State) -->
<label class="group relative flex items-center p-card-padding bg-surface-container-lowest border border-border-light rounded-[16px] cursor-pointer hover:border-outline-variant hover:shadow-sm transition-all">
<input class="sr-only" name="goal" type="radio" value="endurance"/>
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center text-outline shrink-0 mr-4 group-hover:text-primary-container group-hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-[24px]">monitor_heart</span>
</div>
<div class="flex-grow pr-4">
<h3 class="font-body-bold text-body-bold text-on-background mb-1">Endurance (Daya Tahan)</h3>
<p class="font-small text-small text-outline">Meningkatkan stamina dan kebugaran</p>
</div>
<div class="shrink-0 text-outline-variant group-hover:text-outline transition-colors">
<span class="material-symbols-outlined text-[24px]">radio_button_unchecked</span>
</div>
</label>
</div>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 right-0 p-container-margin-mobile bg-gradient-to-t from-bg-light via-bg-light to-transparent z-20">
<div class="max-w-md mx-auto">
<button class="w-full py-btn-v-padding bg-secondary-container text-on-primary font-button text-button rounded-xl flex items-center justify-center gap-2 hover:brightness-110 active:scale-[0.98] transition-all shadow-[0_4px_12px_rgba(254,137,51,0.25)]">
                Lanjut
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</div>
<!-- Simple Script for Radio Interactivity Simulation -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const labels = document.querySelectorAll('label');
            
            labels.forEach(label => {
                label.addEventListener('click', () => {
                    // Reset all
                    labels.forEach(l => {
                        l.classList.remove('border-2', 'border-secondary-container', 'card-shadow');
                        l.classList.add('border', 'border-border-light');
                        
                        const iconContainer = l.querySelector('.w-12');
                        iconContainer.classList.remove('bg-surface-container', 'text-primary-container');
                        iconContainer.classList.add('bg-surface-container-low', 'text-outline');

                        const radioIcon = l.querySelector('.shrink-0:last-child span');
                        radioIcon.textContent = 'radio_button_unchecked';
                        radioIcon.classList.remove('icon-fill');
                        l.querySelector('.shrink-0:last-child').classList.remove('text-secondary-container');
                        l.querySelector('.shrink-0:last-child').classList.add('text-outline-variant');
                    });

                    // Set active
                    label.classList.add('border-2', 'border-secondary-container', 'card-shadow');
                    label.classList.remove('border', 'border-border-light');
                    
                    const activeIconContainer = label.querySelector('.w-12');
                    activeIconContainer.classList.add('bg-surface-container', 'text-primary-container');
                    activeIconContainer.classList.remove('bg-surface-container-low', 'text-outline');

                    const activeRadioIcon = label.querySelector('.shrink-0:last-child span');
                    activeRadioIcon.textContent = 'radio_button_checked';
                    activeRadioIcon.classList.add('icon-fill');
                    label.querySelector('.shrink-0:last-child').classList.add('text-secondary-container');
                    label.querySelector('.shrink-0:last-child').classList.remove('text-outline-variant');
                });
            });
        });
    </script>
</body></html>
